name: Bundle Size Check

# Fails the CI job when any Vite/Rollup output chunk exceeds the
# chunkSizeWarningLimit defined in vite.config.ts (currently 650 kB).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bundle-size:
    name: Check bundle chunk sizes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and check bundle sizes
        # Exits 1 (fails the job) when any JS chunk exceeds 650 kB.
        # To temporarily exempt a chunk, append: --allow <chunkName>
        # Always document the reason in a PR comment when using --allow.
        run: npm run size-check
