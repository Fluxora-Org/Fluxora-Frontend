name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ci-github.workflow-github.ref
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (type-check + bundle)
        run: pnpm run build

      - name: Locale integrity check
        run: npm run check:locales

      - name: Test
        run: pnpm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # NOTE: `npm run lint` is intentionally not run here yet. The repo
      # currently has ~68 pre-existing eslint errors (mostly
      # @typescript-eslint/no-explicit-any) spread across ~15 files that
      # predate this workflow. Fixing them is a real but separate cleanup
      # effort, not something to fold into introducing CI. Once that debt
      # is paid down, add a `run: npm run lint` step here.
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run accessibility tests
        run: pnpm run test:a11y

      - name: Run E2E tests (gateable)
        # One `run:` key per step — duplicate keys are invalid YAML and made
        # every run of this workflow fail at parse time with zero jobs.
        run: |
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|reduced-motion"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|wallet-connect"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|stream-filter-sort"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|embed-widget-display"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|small-viewport-operation"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|transaction-status-resolution"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|first-visit-without-wallet"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|session recovery"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|workspace sharing"
          npm run test:e2e -- --grep="landing-cta|not-found|create-stream|account switching flow"

      - name: Run landing FCP performance budget
        run: npm run test:performance
