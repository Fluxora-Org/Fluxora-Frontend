# CI workflow for Fluxora Frontend
#
# Runs on every push to main and on every pull request targeting main.
# Jobs:
#   build-and-test  – type-check, production build, and unit tests (Node 18 & 20)
#   coverage        – enforces 95% Vitest coverage thresholds and uploads the report
#
# Action versions are pinned to exact commit SHAs to prevent supply-chain drift.
#   actions/checkout      11bd71901bbe5b1630ceea73d27597364c9af683  (v4.2.2)
#   actions/setup-node    49933ea5288caeca8642d1e84afbd3f7d6820020  (v4.4.0)
#   actions/upload-artifact ea165f8d65b6e75b540449e92b4886f43607fa02 (v4.6.2)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Build & unit tests ─────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run unit tests
        run: npm run test

  # ── Coverage gate ──────────────────────────────────────────────────────────
  # Runs after build-and-test to avoid spending coverage time on a broken build.
  # Vitest exits non-zero when any configured threshold is missed, which causes
  # this job – and the overall PR check – to fail.
  coverage:
    name: Coverage Gate (Node 20)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Fails the workflow when statements/branches/functions/lines drop below
        # the 95% thresholds declared in vitest.config.ts.
        run: npm run test:coverage

      - name: Upload coverage report
        # Upload even when the previous step fails so reviewers can inspect the
        # report that caused the threshold miss.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
