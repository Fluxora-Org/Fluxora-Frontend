name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ci-github.workflow-github.ref
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Locale integrity check
        run: npm run check:locales

      - name: Test
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # NOTE: `npm run lint` is intentionally not run here yet. The repo
      # currently has ~68 pre-existing eslint errors (mostly
      # @typescript-eslint/no-explicit-any) spread across ~15 files that
      # predate this workflow. Fixing them is a real but separate cleanup
      # effort, not something to fold into introducing CI. Once that debt
      # is paid down, add a `run: npm run lint` step here.
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Run E2E tests (gateable)
        run: npm run test:e2e -- --grep="landing-cta|not-found|create-stream|reduced-motion"
        run: npm run test:e2e -- --grep="landing-cta|not-found|create-stream|wallet-connect"
        run: npm run test:e2e -- --grep="landing-cta|not-found|create-stream|stream-filter-sort"
