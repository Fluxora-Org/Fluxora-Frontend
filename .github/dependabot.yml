version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - eslint*
        update-types:
          - minor
          - patch
      playwright:
        patterns:
          - "@playwright/test"
        update-types:
          - minor
          - patch
      other-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Pinned to 1.61.0; major bumps require coordinated browser/CI updates.
      - dependency-name: "@playwright/test"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
